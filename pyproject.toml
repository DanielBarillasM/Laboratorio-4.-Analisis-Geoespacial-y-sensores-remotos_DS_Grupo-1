[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab4-geospatial"
version = "0.1.0"
description = "Análisis temporal y espacial de cianobacterias en Atitlán y Amatitlán."
requires-python = ">=3.10"
dependencies = [
  "geopandas>=1.0",
  "jupyterlab>=4.2",
  "matplotlib>=3.8",
  "nbformat>=5.10",
  "numpy>=1.26",
  "openeo>=0.51",
  "pandas>=2.2",
  "rasterio>=1.3",
  "scipy>=1.12",
  "seaborn>=0.13",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
